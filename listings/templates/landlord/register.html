{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landlord Registration - Traca Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .register-container {
            min-height: 100vh;
            padding: 50px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 600px;
            margin: 0 auto;
        }
        .register-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .register-body {
            padding: 40px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .password-match {
            font-size: 0.85em;
            margin-top: 5px;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 38px;
            cursor: pointer;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <i class="fas fa-user-plus fa-3x mb-3"></i>
                <h2 class="mb-0">Landlord Registration</h2>
                <p class="mb-0">Join Traca Management</p>
            </div>
            <div class="register-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name *</label>
                            <input type="text" name="first_name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name *</label>
                            <input type="text" name="last_name" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username *</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" name="phone" class="form-control" placeholder="+254 700 000 000" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Company Name (Optional)</label>
                        <input type="text" name="company_name" class="form-control" placeholder="Leave blank if individual">
                    </div>
                    <div class="mb-3 position-relative">
                        <label class="form-label">Password *</label>
                        <input type="password" name="password1" id="password1" class="form-control" minlength="6" required>
                        <i class="fas fa-eye password-toggle" id="togglePassword1"></i>
                    </div>
                    <div class="mb-3 position-relative">
                        <label class="form-label">Confirm Password *</label>
                        <input type="password" name="password2" id="password2" class="form-control" minlength="6" required>
                        <i class="fas fa-eye password-toggle" id="togglePassword2"></i>
                        <div id="passwordMatch" class="password-match"></div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-register w-100 mb-3">
                        <i class="fas fa-user-plus me-2"></i>Register
                    </button>
                    <div class="text-center">
                        <p class="mb-0">Already have an account? <a href="{% url 'listings:landlord:login' %}" class="text-decoration-none">Login Here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        document.querySelector('#togglePassword1').addEventListener('click', function () {
            const password = document.querySelector('#password1');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        document.querySelector('#togglePassword2').addEventListener('click', function () {
            const password = document.querySelector('#password2');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Password match validation
        const password1 = document.querySelector('#password1');
        const password2 = document.querySelector('#password2');
        const passwordMatch = document.querySelector('#passwordMatch');

        function checkPasswordMatch() {
            if (password2.value === '') {
                passwordMatch.textContent = '';
                password2.style.borderColor = '';
                return;
            }

            if (password1.value === password2.value) {
                passwordMatch.textContent = '✓ Passwords match';
                passwordMatch.style.color = 'green';
                password2.style.borderColor = 'green';
            } else {
                passwordMatch.textContent = '✗ Passwords do not match';
                passwordMatch.style.color = 'red';
                password2.style.borderColor = 'red';
            }
        }

        password1.addEventListener('keyup', checkPasswordMatch);
        password2.addEventListener('keyup', checkPasswordMatch);
    </script>
</body>
</html>
